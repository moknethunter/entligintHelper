plugins {
    id 'com.android.application' version '8.13.2'
    id 'com.chaquo.python' version '17.0.0'
}

android {
    namespace 'com.daleel.workspace'
    compileSdk 36

    defaultConfig {
        applicationId 'com.daleel.workspace'
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName '0.4.0'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }
}

chaquopy {
    defaultConfig {
        version = '3.13'
        if (System.getenv('DALEEL_BUILD_PYTHON')) {
            buildPython(System.getenv('DALEEL_BUILD_PYTHON'))
        }
    }
    sourceSets {
        getByName('main') {
            srcDir(rootProject.file('../../python'))
        }
    }
}
